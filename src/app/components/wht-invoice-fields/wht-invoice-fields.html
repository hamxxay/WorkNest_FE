<div class="wht">
  <label class="wht-check" [for]="idPrefix + '-send'">
    <input type="checkbox" [id]="idPrefix + '-send'" [name]="idPrefix + 'Send'"
      [ngModel]="enabled" (ngModelChange)="onToggle($event)" />
    <span>Generate Withholding Tax (WHT) invoice</span>
  </label>

  @if (enabled) {
  <div class="wht-rate" [class.has-error]="showErrors && !!error">
    <label [for]="idPrefix + '-rate'">WHT Rate *</label>
    <select class="wht-input" [id]="idPrefix + '-rate'" [name]="idPrefix + 'Rate'" required
      [ngModel]="legacyRate !== null ? 'legacy' : (selectedOption ? selectedOption.id : null)" (ngModelChange)="onSelect($event)">
      <option [ngValue]="null" disabled>{{ loaded ? (options.length ? 'Select WHT rate' : 'No WHT rates set up') : 'Loading…' }}</option>
      @for (o of options; track o.id) {
      <option [ngValue]="o.id">{{ o.description }} ({{ o.rate }}%)</option>
      }
      @if (legacyRate !== null) {
      <option value="legacy" disabled>Current rate ({{ legacyRate }}%) – pick a rate from the list</option>
      }
    </select>
    @if (showErrors && error) {
    <div class="wht-error">{{ error }}</div>
    } @else if (selectedOption) {
    <small>Rent + support grossed up at {{ selectedOption.rate }}%. Support, PST and deposit are not.</small>
    } @else {
    <small>Rent + support is grossed up; support, PST and deposit are not.</small>
    }
  </div>
  }
</div>
