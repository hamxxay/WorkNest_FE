<div class="wht">
  <label class="wht-check" [for]="idPrefix + '-send'">
    <input type="checkbox" [id]="idPrefix + '-send'" [name]="idPrefix + 'Send'"
      [ngModel]="enabled" (ngModelChange)="onToggle($event)" />
    <span>Generate Withholding Tax (WHT) invoice</span>
  </label>

  @if (enabled) {
  <div class="wht-rate" [class.has-error]="showErrors && !!error">
    <label [for]="idPrefix + '-rate'">WHT Rate (%) *</label>
    <input class="wht-input" type="number" [id]="idPrefix + '-rate'" [name]="idPrefix + 'Rate'"
      min="0.01" max="99.99" step="0.01" placeholder="e.g. 10" required
      [ngModel]="rate" (ngModelChange)="onRate($event)" />
    @if (showErrors && error) {
    <div class="wht-error">{{ error }}</div>
    } @else {
    <small>Rent, service charges and their tax are grossed up so the amount received after withholding is unchanged. The security deposit is not grossed up.</small>
    }
  </div>
  }
</div>
